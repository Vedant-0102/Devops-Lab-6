version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws sts get-caller-identity
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 309403336970.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t 309403336970.dkr.ecr.ap-south-1.amazonaws.com/devops-lab5-app:$CODEBUILD_RESOLVED_SOURCE_VERSION .

  post_build:
    commands:
      - echo "Pushing Docker image to Amazon ECR..."
      - docker push 309403336970.dkr.ecr.ap-south-1.amazonaws.com/devops-lab5-app:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"Main","imageUri":"309403336970.dkr.ecr.ap-south-1.amazonaws.com/devops-lab5-app:%s"}]' "$CODEBUILD_RESOLVED_SOURCE_VERSION" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json